<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>济南奶龙职业技术学院</title>
<meta name="description" content="济南奶龙职业技术学院 · 站点建设中">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36;
    --fg:#e8eaf0; --dim:#8b93a7; --accent:#6ea8fe;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --card:#fff; --line:#e4e7ec;
           --fg:#1a1d23; --dim:#69718a; --accent:#2563eb; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main{
    width:100%; max-width:560px; background:var(--card);
    border:1px solid var(--line); border-radius:16px;
    padding:40px 32px; text-align:center;
  }
  .dot{
    width:8px; height:8px; border-radius:50%; background:var(--accent);
    display:inline-block; margin-right:8px; vertical-align:middle;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  h1{ font-size:22px; margin:0 0 8px; letter-spacing:.5px; }
  .sub{ color:var(--dim); font-size:14px; margin:0 0 28px; }
  .status{
    display:inline-block; border:1px solid var(--line); border-radius:999px;
    padding:6px 16px; font-size:13px; color:var(--dim); margin-bottom:28px;
  }
  hr{ border:0; border-top:1px solid var(--line); margin:28px 0; }
  .meta{ font-size:12px; color:var(--dim); line-height:1.9; word-break:break-all; }
  code{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
</style>
</head>
<body>
<main>
  <h1>济南奶龙职业技术学院</h1>
  <p class="sub">Jinan Nailong Vocational &amp; Technical College</p>

  <div class="status"><span class="dot"></span>站点正在建设中</div>

  <p style="color:var(--dim);font-size:14px;margin:0">
    域名已经注册，页面还没开始搭。<br>
    这里很快会有东西。
  </p>

  <hr>
  <p class="meta">
    域名：济南奶龙职业技术学院.icu<br>
    Punycode：<code>xn--vhq90kl3fz5byvotjhjqlnj2b9s4b3it.icu</code>
  </p>
</main>
</body>
</html>
